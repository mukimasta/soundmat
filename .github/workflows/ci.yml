name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # 编译音色，并用真实的 scsynth（JACK dummy 驱动，没有声卡）跑一遍
  synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends supercollider-server supercollider-language jackd2
      - run: uv sync
      - run: uv run python scripts/compile_instruments.py
      - run: |
          jackd -r -d dummy -r 48000 -p 1024 &
          sleep 2
          scsynth -u 57110 -i 0 -o 2 &
          sleep 3
      - run: uv run pytest -q tests/test_scsynth.py -rs
