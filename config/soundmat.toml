# SoundMat 主机程序配置
#
# 这里是描述硬件和系统本身的固定参数（DATA_MODEL「配置与设置」、DECISION 第 5 条）：
# 部署前测定，随仓库分发，程序启动时读取，运行中不变，控制台只读显示。
# 改参数 = 改这个文件并重新部署。随场地变化的参数（音箱布局、总音量、默认编排等）
# 是设置，由状态中心保存在 data/settings.json，不写在这里。
#
# 压力相关数值沿用 12 位 ADC 原始读数（满量程 4095），载入时换算成归一化压力。

[mat]
# 压力满量程（ADC 原始读数），换算：归一化压力 = 读数 / full_scale
full_scale = 4095
# 放下阈值（ADC 原始读数）。2026-10-20 在 Pi 5 的真垫子上实测：真石头在外环读 70–230（×1/1000 满量程，
# 即原始 290–940），同样的砝码在内两环只有外环的一半左右；空区偶尔单帧跳到 40–70（原始 160–290）。
# 第一版的 500 让很多石头不响。外环 245（≈ 60/1000），内两环 185（≈ 45/1000）。
occupancy_threshold = 245
inner_occupancy_threshold = 185
# 上面两个阈值是一颗石头的总压力（压到的几个区加起来，以各自的阈值为单位）。一个区读数达到自己阈值的
# floor_ratio 倍才算被这颗石头压到；石头还在不在也按这条线看，所以拿起要读数几乎降到底。
# 实测拿起后 96% 在一帧之内降到这条线以下，空区的单帧跳动中位数约为阈值的一半。
floor_ratio = 0.4
# 去抖：总压力持续 occupy_hold 秒才算放下；静止的石头找不到压力 release_hold 秒才算拿起，刚挪动过的
# 石头等 release_hold_moving 秒（拖过分界线时两边会短暂都读不到）。控制器约 29 帧/秒。
occupy_hold = 0.08
release_hold = 0.08
release_hold_moving = 0.4
# 串扰：同一根扇区导电条上别处有压力，这根条上的读数被拉低（实测平均掉到 0.43 倍）。已有石头的读数按
# u × (1 + crosstalk × 这根条上其余读数之和) 补回来，不会因此被当成拿起；新出现的压力不补偿。
crosstalk = 7.0
# 放下、拿起、挪动都停下这么多秒后，发出一次"静下来"
settle = 3.0
# 接线到区域的对应关系（第一版部署时校准）：扇区镜像开启，整体顺时针旋转 4 个扇区
sector_mirror = true
sector_offset = 4
# 压力大时 ADC 读数变小的传感器需要反相；当前传感器不需要
invert = false

[light]
# 灯珠数量；逻辑位置 0 在 12 点方向（0°），顺时针编号
led_count = 108
# 物理对齐偏移：逻辑位置 k 的颜色写到物理灯珠 (k + led_offset) % led_count
led_offset = 101
# 灯光引擎刷新率（次/秒），也是上限。控制器固件在扫描传感器的同一个循环里刷新灯带，实物灯带的
# 实际刷新率就是传感帧率（约 25–30）；发得比它快只是白算（在 Pi 3B 上，60 时灯光线程占约 22% 的核）
refresh_hz = 30

[sound]
# 声音化节拍（次/秒）
tick_hz = 60
# 同时发声的声部上限：total 是总数，categories 按声部类别再分别限制
voice_budget_total = 48
voice_budget_categories = { melodic = 12 }
# 有确定时刻的声音（鼓点、扫描命中、下一小节的和声）推后多少秒交给合成器服务（秒）。
# 合成器服务要在音频缓冲开始计算之前收到指令才能准时：至少是 JACK 缓冲（每块帧数 × 块数 / 采样率）
# 再加一块，另留余量给主机偶尔的延迟。Pi 3B 上 2048 × 2 / 48000 = 85 ms，加一块 43 ms，取 0.15。
# 改小 JACK 缓冲（例如 Pi 5 上 1024 或 512）时同步改小。其余声音（预听、参数、音量）不带时刻，立即发出。
schedule_ahead = 0.15
# 有确定时刻的声音，主机交出时已经晚了多少秒以内仍立即发出，超过则丢弃并计为迟到
late_tolerance = 0.05
# 声音素材的内存预算（MB）；Pi 5 内存 2 GB
asset_memory_mb = 768
# 期望的合成器服务状态，系统监测据此判断是否一致
expected_sample_rate = 48000
expected_output_device = "USB"

[synth]
# 合成器服务（scsynth）地址
host = "127.0.0.1"
port = 57110
# 编译好的音色（sclang instruments/build.scd 的产物），相对于程序目录
synthdefs = "instruments/compiled"

[control]
host = "0.0.0.0"
port = 8000

[system]
# 主机程序的 systemd 服务名；看板据此显示自动重启次数（不在 systemd 下运行时显示"未知"）
service = "soundmat.service"

[network]
# 看板按 NetworkManager 的连接名区分网络类型：手机热点、自建热点，其他 Wi-Fi 是外部网络，网线是有线。
# 名字与 system/network/ 和 DEPLOYMENT.md「网络」一节建立的连接一致。
interface = "wlan0"
phone_hotspot = "phone-hotspot"
self_hotspot = "soundmat-ap"

[update]
# 软件更新从这个 GitHub 仓库的预发布版本（build-<短提交号>）下载发布包，见 DEPLOYMENT.md「发布与更新」
repo = "mukimasta/soundmat"
