[project]
name = "soundmat"
version = "0.2.0"
description = "SoundMat 主机程序：感知垫面，生成声音与灯光，提供网页控制台"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "wsproto>=1.2",
    "soundfile>=0.14.0",
    "pyserial>=3.5",
]

[project.scripts]
soundmat = "soundmat.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundmat"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
