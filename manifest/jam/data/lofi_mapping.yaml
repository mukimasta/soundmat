# Lo-Fi 强度（R0/R1 压力，0–1000）→ master FX 参数（分段线性关键点）。
# 默认曲线复刻 web demo（JAM_DESIGN §3）：
#   cutoff = 14000·(420/14000)^(level/2000)   （level 1000 → ≈2425 Hz）
#   drive  = level/40000                       （level 1000 → 0.025）
# 越高 → 越闷、越温暖、磁带颗粒/年代味越重。gain 补偿 LPF/饱和造成的电平损失。
master:
  cutoff: {0: 14000, 250: 9500, 500: 6447, 750: 4376, 1000: 2425}
  drive:  {0: 0.0,   250: 0.00625, 500: 0.0125, 750: 0.01875, 1000: 0.025}
  gain:   {0: 1.0,   250: 1.08,    500: 1.16,   750: 1.24,    1000: 1.45}
