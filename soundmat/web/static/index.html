<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundMat</title>
<link rel="stylesheet" href="/static/soundmat.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">SoundMat</a>
    <nav class="site-nav">
      <a href="/" class="is-active">Control</a>
      <a href="/mat">Mat</a>
      <a href="/debug">Debug</a>
    </nav>
  </header>

  <main class="page">
    <section class="card status-hero">
      <div class="status-row">
        <div class="status-main">
          <span id="dot" class="dot off"></span>
          <h1 class="status-name" id="statusText">…</h1>
        </div>
        <div class="status-chord" id="chordBlock" hidden>
          <div class="status-chord-value" id="chord"></div>
          <div class="status-chord-meta" id="chordMeta"></div>
        </div>
      </div>
      <p class="status-sub" id="statusSub"></p>
      <div class="status-detail" id="detail"></div>
      <div class="progress-track jam-only" id="progressWrap" hidden>
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title">Presets</h2>
      <div class="mode-grid" id="modeGrid"></div>
      <div class="mode-switch-msg" id="switchMsg"></div>
    </section>

    <section class="card">
      <h2 class="card-title">Mix</h2>
      <div class="mix-row">
        <label for="vol">Volume</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0" />
        <span class="mix-value" id="volLabel">—</span>
      </div>
      <div class="jam-only" id="bpmBlock" hidden>
        <div class="row" style="margin-top:4px">
          <label>BPM</label>
        </div>
        <div class="bpm-pills" id="bpmPills"></div>
      </div>
      <div class="mix-row jam-only" id="placePreviewBlock" hidden>
        <label for="loopPlacePreview" title="Loop 播放中放 melody/bass 石立刻响一声；0=关">Place preview</label>
        <input id="loopPlacePreview" type="range" min="0" max="1" step="0.01" value="0" />
        <span class="mix-value" id="loopPlacePreviewLabel">—</span>
      </div>
    </section>

    <details class="dev-details">
      <summary>Developer</summary>
      <div class="dev-body">
        <p class="dev-hint">
          Restart / Stop reloads or halts the entire mode thread. This is <strong>not</strong> Jam transport
          (use R0/R1 stones on the Mat page to start playback).
        </p>
        <div class="row">
          <span class="muted">Mode lifecycle</span>
          <span>
            <button id="start" type="button">Restart</button>
            <button id="stop" type="button" class="btn-ghost">Stop</button>
          </span>
        </div>
      </div>
    </details>
  </main>

<script>
const $ = s => document.querySelector(s);
const BPM_PRESETS = [80, 100, 120, 140, 160];
let manifests = [], currentPath = null, currentRel = null, switching = false, volDragging = false;

function normPath(p) {
  return p ? String(p).replace(/\\/g, "/") : "";
}

function manifestIsActive(m) {
  if (currentPath == null && currentRel == null) return false;
  if (currentPath != null && m.path === currentPath) return true;
  const cur = normPath(currentPath);
  const mp = normPath(m.path);
  if (cur && mp && cur === mp) return true;
  if (currentRel != null && m.rel === currentRel) return true;
  const rel = normPath(m.rel);
  return !!(cur && rel && (cur.endsWith("/" + rel) || cur.endsWith(rel)));
}

async function getJSON(u){ return (await fetch(u)).json(); }
async function postJSON(u, body){
  const res = await fetch(u, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function setSwitchMsg(text, isError = false){
  const el = $("#switchMsg");
  el.textContent = text;
  el.className = "mode-switch-msg" + (isError ? " is-error" : "");
}

function renderModeGrid(){
  const grid = $("#modeGrid");
  grid.innerHTML = "";
  for (const m of manifests) {
    const active = manifestIsActive(m);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mode-card mode-card--" + m.mode + (active ? " is-active" : "");
    btn.disabled = switching;
    btn.innerHTML =
      `<div class="mode-card-head">` +
        `<span class="mode-card-name">${m.name}</span>` +
        `<span class="mode-badge">${m.mode}</span>` +
      `</div>` +
      `<p class="mode-card-desc">${m.description || m.rel}</p>` +
      (active ? `<span class="mode-card-mark">Active</span>` : "");
    if (!active) {
      btn.onclick = () => switchMode(m.path);
    }
    grid.appendChild(btn);
  }
}

async function switchMode(path){
  if (switching || path === currentPath) return;
  switching = true;
  setSwitchMsg("Switching…");
  renderModeGrid();
  try {
    await postJSON("/api/mode", { manifest: path });
    setSwitchMsg("");
    await refresh();
  } catch (e) {
    setSwitchMsg(String(e.message || e), true);
  } finally {
    switching = false;
    renderModeGrid();
  }
}

function renderBpmPills(activeBpm){
  const box = $("#bpmPills");
  box.innerHTML = "";
  for (const b of BPM_PRESETS) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "bpm-pill" + (b === activeBpm ? " is-active" : "");
    btn.textContent = String(b);
    btn.onclick = async () => {
      await postJSON("/api/params", { key: "bpm", value: b });
      refresh();
    };
    box.appendChild(btn);
  }
}

function syncVolume(v){
  if (v == null || volDragging) return;
  const vol = $("#vol");
  vol.value = v;
  $("#volLabel").textContent = Math.round(v * 100) + "%";
}

async function refresh(){
  const st = await getJSON("/api/status");
  currentPath = st.manifest ?? null;
  currentRel = st.manifest_rel ?? null;
  const app = st.app || {};
  const isJam = st.mode === "jam" || app.mode === "jam";

  $("#dot").className = "dot " + (st.mode ? "on" : "off");
  $("#statusText").textContent = st.name || "no mode";

  const cur = manifests.find(m => manifestIsActive(m));
  $("#statusSub").textContent = cur?.description || "";

  const chordEl = $("#chordBlock");
  if (isJam && app.chord) {
    chordEl.hidden = false;
    $("#chord").textContent = app.chord;
    $("#chordMeta").textContent = app.bar_global != null ? `bar ${app.bar_global}` : "";
  } else {
    chordEl.hidden = true;
  }

  $("#bpmBlock").hidden = !isJam;
  document.querySelectorAll(".jam-only").forEach(el => {
    if (el.id !== "bpmBlock") el.hidden = !isJam;
  });

  const progWrap = $("#progressWrap"), progFill = $("#progressFill");
  if (isJam && app.form_duration > 0) {
    progWrap.hidden = false;
    const pct = Math.min(100, (app.musical_time || 0) / app.form_duration * 100);
    progFill.style.width = pct + "%";
    const state = app.playing ? "playing" : (app.form_ended ? "form ended" : "idle");
    $("#detail").textContent =
      `${state} · ${(app.musical_time || 0).toFixed(1)} / ${app.form_duration}s` +
      (app.bpm ? ` · ${app.bpm} bpm` : "") +
      (app.lofi != null ? ` · Lo-Fi ${app.lofi}` : "");
    if (app.bpm) renderBpmPills(app.bpm);
  } else if (st.mode === "ambient") {
    progWrap.hidden = true;
    $("#detail").textContent = app.occupied != null
      ? `${app.occupied} stone${app.occupied !== 1 ? "s" : ""} on mat`
      : "";
  } else {
    progWrap.hidden = true;
    $("#detail").textContent = "";
  }

  syncVolume(app.master_volume);
  const loopPlacePreview = $("#loopPlacePreview");
  const loopPlacePreviewLabel = $("#loopPlacePreviewLabel");
  if (loopPlacePreview && st.jam_loop_place_preview_vel != null) {
    const v = +st.jam_loop_place_preview_vel;
    loopPlacePreview.value = String(v);
    loopPlacePreviewLabel.textContent = v <= 0 ? "Off" : Math.round(v * 100) + "%";
  }
  renderModeGrid();
}

const volEl = $("#vol");
volEl.addEventListener("pointerdown", () => { volDragging = true; });
volEl.addEventListener("pointerup", () => { volDragging = false; });
volEl.addEventListener("pointercancel", () => { volDragging = false; });
volEl.addEventListener("input", () => {
  $("#volLabel").textContent = Math.round(+volEl.value * 100) + "%";
});
volEl.addEventListener("change", async () => {
  volDragging = false;
  await postJSON("/api/params", { key: "master_volume", value: +volEl.value });
  refresh();
});

$("#start").onclick = async () => {
  await postJSON("/api/transport", { action: "start" });
  refresh();
};
$("#stop").onclick = async () => {
  await postJSON("/api/transport", { action: "stop" });
  refresh();
};

const loopPlacePreviewEl = $("#loopPlacePreview");
if (loopPlacePreviewEl) {
  loopPlacePreviewEl.addEventListener("input", () => {
    const v = +loopPlacePreviewEl.value;
    $("#loopPlacePreviewLabel").textContent = v <= 0 ? "Off" : Math.round(v * 100) + "%";
  });
  loopPlacePreviewEl.addEventListener("change", async () => {
    await postJSON("/api/params", {
      key: "jam_loop_place_preview_vel",
      value: +loopPlacePreviewEl.value,
    });
    refresh();
  });
}

(async () => {
  manifests = await getJSON("/api/manifests");
  await refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
