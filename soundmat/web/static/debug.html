<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundMat · Debug</title>
<link rel="stylesheet" href="/static/soundmat.css" />
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">SoundMat</a>
    <nav class="site-nav">
      <a href="/">Control</a>
      <a href="/mat">Mat</a>
      <a href="/debug" class="is-active">Debug</a>
    </nav>
  </header>

  <main class="page page--wide">
    <div class="row">
      <span class="label-xs">Event Stream</span>
      <span class="muted">/api/event_stream · 10 Hz</span>
    </div>
    <div class="debug-panel">
      <pre id="out">connecting…</pre>
    </div>
  </main>

<script>
const out = document.getElementById("out");
const proto = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${proto}://${location.host}/api/event_stream`);
ws.onmessage = e => { out.textContent = JSON.stringify(JSON.parse(e.data), null, 2); };
ws.onopen = () => { out.textContent = "connected…"; };
ws.onclose = () => { out.textContent += "\n\n[closed]"; };
</script>
</body>
</html>
