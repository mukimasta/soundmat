<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SoundMat · Heatmap</title>
<style>
  body { margin:0; background:#08080e; color:#c0b8a0; font:13px Georgia,serif;
         display:flex; flex-direction:column; align-items:center; padding:16px; }
  a { color:#c0b8a0; } canvas { margin-top:12px; }
  .muted { opacity:.5; }
</style>
</head>
<body>
  <div><a href="/">← Control</a> · 传感热力图 <span class="muted" id="info"></span></div>
  <canvas id="cv" width="560" height="560"></canvas>
<script>
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const CX = 280, CY = 280, RMAX = 250, RINGS = 8, SLICES = 32, ADC = 4095;

function draw(matrix){
  ctx.clearRect(0,0,560,560);
  if(!matrix) return;
  const ringW = RMAX / RINGS;
  for(let r=0;r<RINGS;r++){
    // ring 0 最内 → 半径小；几何 index 反过来
    const inner = r*ringW, outer = (r+1)*ringW;
    for(let s=0;s<SLICES;s++){
      const v = Math.max(0, matrix[r][s]) / ADC;
      const a0 = (s/SLICES)*2*Math.PI - Math.PI/2 - Math.PI/SLICES;
      const a1 = a0 + 2*Math.PI/SLICES;
      ctx.beginPath();
      ctx.arc(CX,CY,outer,a0,a1); ctx.arc(CX,CY,inner,a1,a0,true); ctx.closePath();
      const lum = Math.round(v*255);
      ctx.fillStyle = `rgb(${lum},${Math.round(lum*0.6)},${Math.round(40+lum*0.3)})`;
      ctx.fill();
      ctx.strokeStyle = "#1a1a24"; ctx.stroke();
    }
  }
}

const proto = location.protocol === "https:" ? "wss" : "ws";
const ws = new WebSocket(`${proto}://${location.host}/api/sensor_stream`);
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  document.getElementById("info").textContent = d.matrix ? `seq ${d.seq}` : "no frame";
  draw(d.matrix);
};
</script>
</body>
</html>
